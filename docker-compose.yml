  #     - DATABASE_URL=postgresql://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-agrilink}
  #   networks:
  #     - agrilink-network

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: agrilink-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:5173"
  #   networks:
